name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for versioning
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
    
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: uv sync --group dev
    
    - name: Lint and format with ruff
      uses: astral-sh/ruff-action@v3
      with:
        src: "./app"
        version-file: "./pyproject.toml"
        args: "check"
    
    - name: Check code formatting with ruff
      uses: astral-sh/ruff-action@v3
      with:
        src: "./app"
        version-file: "./pyproject.toml"
        args: "format --check --diff"
    
    - name: Test import
      run: uv run python -c "from app.main import main; print('Import successful')"
    
    - name: Test CLI
      run: uv run python run.py --help

  build-binary:
    needs: test
    runs-on: ${{ matrix.runner }}
    if: github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: amd64
            docker-platform: linux/amd64
          - runner: ubuntu-22.04
            platform: linux
            arch: arm64
            docker-platform: linux/arm64
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Generate version
      id: version
      run: |
        VERSION=$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"
    
    - name: Build binary with Docker
      run: |
        # Create a multi-stage Dockerfile for building
        cat > Dockerfile.build << 'EOF'
        FROM --platform=${{ matrix.docker-platform }} ghcr.io/astral-sh/uv:python3.12-alpine AS builder
        
        # Install PyInstaller dependencies
        RUN apk add --no-cache gcc musl-dev libffi-dev
        
        WORKDIR /app
        COPY pyproject.toml uv.lock README.md LICENSE ./
        COPY app/ ./app/
        COPY run.py ./
        
        # Set version environment variable
        ENV SETUPTOOLS_SCM_PRETEND_VERSION_FOR_MUXER=${{ steps.version.outputs.version }}
        
        # Install dependencies including dev group
        RUN uv sync --group dev
        
        # Build the binary
        RUN uv run pyinstaller --onefile \
            --name muxer-${{ matrix.platform }}-${{ matrix.arch }} \
            --hidden-import=app \
            --add-data "app:app" \
            run.py
        
        # Output stage
        FROM scratch AS output
        COPY --from=builder /app/dist/muxer-${{ matrix.platform }}-${{ matrix.arch }} /
        EOF
        
        # Build and extract binary
        docker buildx build \
          --platform ${{ matrix.docker-platform }} \
          --target output \
          --output type=local,dest=./dist \
          -f Dockerfile.build \
          .
    
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: muxer-${{ matrix.platform }}-${{ matrix.arch }}
        path: dist/muxer-${{ matrix.platform }}-${{ matrix.arch }}

  build-docker:
    needs: test
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Generate version
      id: version
      run: |
        # Generate version based on date and short SHA
        VERSION=$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/muxer:latest
          ghcr.io/${{ github.repository_owner }}/muxer:${{ steps.version.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  create-release:
    needs: [test, build-binary, build-docker]
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Generate version
      id: version
      run: |
        VERSION=$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"
    
    - name: Download all binary artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: muxer-*
        path: ./artifacts
        merge-multiple: true
    
    - name: Make binaries executable
      run: |
        chmod +x ./artifacts/muxer-linux-amd64
        chmod +x ./artifacts/muxer-linux-arm64
        ls -la ./artifacts/
    
    - name: Generate changelog
      id: changelog
      run: |
        # Get commits since last tag or from beginning
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$LAST_TAG" ]; then
          COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
        else
          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
        fi
        
        # Create changelog
        cat > CHANGELOG.md << EOF
        ## Changes in ${{ steps.version.outputs.version }}
        
        $COMMITS
        
        ## Docker Image
        \`\`\`bash
        docker pull ghcr.io/${{ github.repository_owner }}/muxer:${{ steps.version.outputs.version }}
        \`\`\`
        
        ## Binary Usage
        
        ### Linux AMD64
        \`\`\`bash
        ./muxer-linux-amd64 -i /path/to/video.mkv
        ./muxer-linux-amd64 -i /path/to/directory/
        \`\`\`
        
        ### Linux ARM64
        \`\`\`bash
        ./muxer-linux-arm64 -i /path/to/video.mkv
        ./muxer-linux-arm64 -i /path/to/directory/
        \`\`\`
        EOF
    
    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        bodyFile: CHANGELOG.md
        artifacts: "./artifacts/*"
        token: ${{ secrets.GITHUB_TOKEN }}
        draft: false
        prerelease: false 