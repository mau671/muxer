[project]
name = "muxer"
dynamic = ["version"]
description = "MKV file processor with automatic track naming and language configuration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=14.0.0",
]
authors = [
    {name = "Mauricio González Prendas"},
]
license = {text = "MIT"}
keywords = ["mkv", "video", "muxing", "subtitles", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/mau671/muxer"
"Bug Reports" = "https://github.com/mau671/muxer/issues"
"Source" = "https://github.com/mau671/muxer"

[project.scripts]
muxer = "app.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.hooks.vcs]
version-file = "app/_version.py"

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "pyinstaller>=6.14.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "app/_version.py",  # Generated by hatch-vcs
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
